<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coral Tour</title>

  <!-- ✅ FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">
    <div class="mask" id="logoTrigger"> <!-- ✅ UPDATED: thêm id -->

      <div class="fish">🐠</div>

      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
      <div class="bubble b3"></div>

      <div class="text">
        <div class="text1">
          "<span class="billy">billy</span>
          <span class="and">and</span>
          <span class="friend">friend</span>"
        </div>
        <div class="text2">adventures</div>
      </div>

    </div>
  </div>
</header>

<section class="hero">
  <div class="overlay"></div>

  <h1 class="title">Khám phá đại dương xanh</h1>

  <div class="story">
    <p>
      "Xin chào! I am Bill, Billy the Bill .Tôi sinh ra và lớn lên ở vùng đất Phú Quốc thân yêu này..."
    </p>
  </div>

  <div class="cta-row">

    <span class="quote">
      <span>let's...</span>

      <label class="checkbox">
        <input type="checkbox">
        <span class="fake-box"></span>
      </label>

      <span>"Leave no trace"</span>
    </span>

    <span class="thanks">Cảm ơn bạn ❤️</span>

  </div>

</section>

<!-- ✅ NEW: POPUP -->
<div class="popup-box" id="popupBox">
  <div class="popup-content">
    <p>Body Call Me Baby</p>
  </div>
</div>

<!-- ✅ NEW: SCRIPT -->
<script>
const logo = document.getElementById("logoTrigger"); /* ✅ UPDATED */
const popup = document.getElementById("popupBox");

/* ✅ OPEN */
logo.addEventListener("click", () => {
  popup.classList.add("active");
});

/* ✅ CLOSE khi click nền */
popup.addEventListener("click", (e) => {
  if (e.target === popup) {
    popup.classList.remove("active");
  }
});
</script>

</body>
</html>
