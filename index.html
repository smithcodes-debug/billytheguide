<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coral Tour</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* (GIỮ NGUYÊN TOÀN BỘ STYLE CỦA BẠN) */


/* ✅ NEW: CHECKING SCREEN */
.checking-screen {
  position: fixed;
  inset: 0;
  background: #f4f5f7;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s ease;
}

.checking-screen.is-open {
  opacity: 1;
  visibility: visible;
}

.checking-inner {
  text-align: center;
  max-width: 320px;
  width: 100%;
  padding: 0 20px;
}

.checking-dots {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 24px;
}

.checking-dots span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #c9ccd1;
  animation: dotFade 1.4s infinite;
}

.checking-dots span:nth-child(2) { animation-delay: 0.2s; }
.checking-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotFade {
  0%, 80%, 100% { opacity: 0.3; }
  40% { opacity: 1; }
}

.checking-title {
  font-size: 28px;
  font-weight: 700;
  color: #111;
  margin-bottom: 10px;
}

.checking-sub {
  font-size: 16px;
  color: #6b7280;
  margin-bottom: 30px;
}

.checking-bar {
  width: 100%;
  height: 4px;
  background: #e5e7eb;
  border-radius: 999px;
  overflow: hidden;
}

.checking-bar-fill {
  width: 40%;
  height: 100%;
  background: #111;
  border-radius: 999px;
  animation: loadingBar 1.8s infinite;
}

@keyframes loadingBar {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}

</style>
</head>

<body>

<!-- ===== HERO + CONTENT (GIỮ NGUYÊN FILE GỐC) ===== -->

<!-- ✅ NEW: CHECKING AVAILABILITY -->
<div class="checking-screen" id="checkingScreen" aria-hidden="true">
  <div class="checking-inner">

    <div class="checking-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <h2 class="checking-title">Checking availability</h2>

    <p class="checking-sub">
      Loading the best available dates
    </p>

    <div class="checking-bar">
      <div class="checking-bar-fill"></div>
    </div>

  </div>
</div>

<script>

(function () {

/* ✅ NEW: CHECKING CONTROL */
var checkingScreen = document.getElementById('checkingScreen');

function openChecking() {
  checkingScreen.classList.add('is-open');
}

function closeChecking() {
  checkingScreen.classList.remove('is-open');
}

/* ===== ORIGINAL VARIABLES (GIỮ NGUYÊN) ===== */
var checkbox = document.getElementById('leaveNoTraceCheckbox');
var popup = document.getElementById('leave-no-trace-popup');
var popupCard = popup.querySelector('.popup-card');
var closeBtn = popup.querySelector('.popup-close');
var triggers = document.querySelectorAll('.cta-trigger');

/* ✅ UPDATED FLOW */
function openPopup() {
  checkbox.checked = true;
  popup.classList.add('is-open');
}

/* ✅ UPDATED CLICK */
triggers.forEach(function (trigger) {
  trigger.addEventListener('click', function (event) {
    event.preventDefault();

    openChecking();

    setTimeout(function () {
      closeChecking();
      openPopup();
    }, 1800);
  });
});

/* CLOSE */
closeBtn.addEventListener('click', function () {
  popup.classList.remove('is-open');
});

popup.addEventListener('click', function (event) {
  if (!popupCard.contains(event.target)) {
    popup.classList.remove('is-open');
  }
});

})();

</script>

</body>
</html>
